# GitLab Pages CI/CD configuration
# Automatically deploys the static academic homepage to https://assassinaj602.gitlab.io/

image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html style.css script.js avatar.jpg Muhammad_Assad_Ullah_CV.pdf public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
